<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma Todolist — Botanical Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --fern: #4a7c59;
    --fern-dark: #365f42;
    --marigold: #f9a620;
    --terracotta: #b7472a;
    --cream: #f5f3ed;
    --font-header: 'Merriweather', 'DejaVu Serif', serif;
    --font-body: 'Source Sans 3', 'DejaVu Sans', sans-serif;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 20%, rgba(74,124,89,0.10) 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(249,166,32,0.12) 0%, transparent 45%),
      var(--cream);
    font-family: var(--font-body);
    color: var(--fern-dark);
    display:flex;
    justify-content:center;
    padding: 40px 16px;
  }

  .app{
    width:100%;
    max-width: 560px;
  }

  header{
    text-align:center;
    margin-bottom: 28px;
  }

  header .leaf{
    font-size: 34px;
    display:block;
    margin-bottom: 6px;
  }

  h1{
    font-family: var(--font-header);
    font-weight: 900;
    font-size: 2rem;
    color: var(--fern);
    margin: 0 0 4px 0;
    letter-spacing: 0.5px;
  }

  header p{
    margin:0;
    color: var(--terracotta);
    font-weight: 600;
    font-size: 0.95rem;
  }

  .card{
    background: #ffffff;
    border-radius: 18px;
    padding: 24px;
    box-shadow: 0 10px 30px rgba(74,124,89,0.12);
    border: 1px solid rgba(74,124,89,0.15);
  }

  .add-row{
    display:flex;
    gap: 10px;
    margin-bottom: 18px;
  }

  #taskInput{
    flex:1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 2px solid rgba(74,124,89,0.25);
    font-family: var(--font-body);
    font-size: 1rem;
    background: var(--cream);
    color: var(--fern-dark);
    outline:none;
    transition: border-color 0.2s;
  }
  #taskInput:focus{
    border-color: var(--fern);
  }

  #addBtn{
    background: var(--fern);
    color: white;
    border:none;
    border-radius: 10px;
    padding: 0 20px;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 1rem;
    cursor:pointer;
    transition: background 0.2s, transform 0.1s;
  }
  #addBtn:hover{ background: var(--fern-dark); }
  #addBtn:active{ transform: scale(0.96); }

  .filters{
    display:flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .filter-btn{
    flex:1;
    padding: 8px 0;
    border-radius: 999px;
    border: 2px solid rgba(74,124,89,0.2);
    background: transparent;
    color: var(--fern-dark);
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.85rem;
    cursor:pointer;
    transition: all 0.2s;
  }
  .filter-btn.active{
    background: var(--marigold);
    border-color: var(--marigold);
    color: #4a3300;
  }

  ul#taskList{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap: 10px;
    min-height: 60px;
  }

  li.task{
    display:flex;
    align-items:center;
    gap: 12px;
    background: var(--cream);
    border-radius: 12px;
    padding: 12px 14px;
    border-left: 4px solid var(--fern);
    animation: fadeIn 0.25s ease;
  }

  li.task.done{
    border-left-color: var(--marigold);
    opacity: 0.65;
  }

  @keyframes fadeIn{
    from{ opacity:0; transform: translateY(-6px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .checkbox{
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--fern);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    background: white;
    transition: background 0.2s;
  }
  .checkbox.checked{
    background: var(--fern);
  }
  .checkbox.checked::after{
    content:"✓";
    color:white;
    font-size: 13px;
    font-weight:bold;
  }

  .task-text{
    flex:1;
    font-size: 1rem;
    word-break: break-word;
  }
  li.task.done .task-text{
    text-decoration: line-through;
    color: var(--terracotta);
  }

  .delete-btn{
    background:none;
    border:none;
    color: var(--terracotta);
    font-size: 1.2rem;
    cursor:pointer;
    opacity: 0.6;
    transition: opacity 0.2s, transform 0.15s;
    flex-shrink:0;
  }
  .delete-btn:hover{
    opacity:1;
    transform: scale(1.15);
  }

  .empty-state{
    text-align:center;
    color: var(--fern);
    opacity: 0.6;
    font-style: italic;
    padding: 24px 0;
  }

  .stats{
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px dashed rgba(74,124,89,0.3);
    display:flex;
    justify-content: space-between;
    align-items:center;
    font-size: 0.85rem;
    color: var(--fern-dark);
  }

  #clearDone{
    background:none;
    border:none;
    color: var(--terracotta);
    font-family: var(--font-body);
    font-weight:600;
    font-size: 0.85rem;
    cursor:pointer;
    text-decoration: underline;
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <span class="leaf">🌿</span>
    <h1>Ma Todolist</h1>
    <p>Botanical Garden</p>
  </header>

  <div class="card">
    <div class="add-row">
      <input type="text" id="taskInput" placeholder="Ajouter une tâche..." maxlength="120">
      <button id="addBtn">Ajouter</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">Toutes</button>
      <button class="filter-btn" data-filter="active">En cours</button>
      <button class="filter-btn" data-filter="done">Terminées</button>
    </div>

    <ul id="taskList"></ul>

    <div class="stats">
      <span id="statsText">0 tâche</span>
      <button id="clearDone">Effacer terminées</button>
    </div>
  </div>
</div>

<script>
  let tasks = [];
  let currentFilter = 'all';
  let nextId = 1;

  const taskInput = document.getElementById('taskInput');
  const addBtn = document.getElementById('addBtn');
  const taskList = document.getElementById('taskList');
  const statsText = document.getElementById('statsText');
  const clearDoneBtn = document.getElementById('clearDone');
  const filterBtns = document.querySelectorAll('.filter-btn');

  function addTask(){
    const text = taskInput.value.trim();
    if(!text) return;
    tasks.push({ id: nextId++, text, done: false });
    taskInput.value = '';
    render();
  }

  function toggleTask(id){
    const t = tasks.find(t => t.id === id);
    if(t) t.done = !t.done;
    render();
  }

  function deleteTask(id){
    tasks = tasks.filter(t => t.id !== id);
    render();
  }

  function clearDone(){
    tasks = tasks.filter(t => !t.done);
    render();
  }

  function setFilter(filter){
    currentFilter = filter;
    filterBtns.forEach(b => b.classList.toggle('active', b.dataset.filter === filter));
    render();
  }

  function render(){
    let visible = tasks;
    if(currentFilter === 'active') visible = tasks.filter(t => !t.done);
    if(currentFilter === 'done') visible = tasks.filter(t => t.done);

    taskList.innerHTML = '';

    if(visible.length === 0){
      const empty = document.createElement('li');
      empty.className = 'empty-state';
      empty.textContent = tasks.length === 0
        ? "Aucune tâche pour l'instant — plantez-en une 🌱"
        : "Rien à afficher dans ce filtre";
      taskList.appendChild(empty);
    } else {
      visible.forEach(t => {
        const li = document.createElement('li');
        li.className = 'task' + (t.done ? ' done' : '');

        const cb = document.createElement('div');
        cb.className = 'checkbox' + (t.done ? ' checked' : '');
        cb.onclick = () => toggleTask(t.id);

        const span = document.createElement('span');
        span.className = 'task-text';
        span.textContent = t.text;

        const del = document.createElement('button');
        del.className = 'delete-btn';
        del.textContent = '✕';
        del.onclick = () => deleteTask(t.id);

        li.appendChild(cb);
        li.appendChild(span);
        li.appendChild(del);
        taskList.appendChild(li);
      });
    }

    const doneCount = tasks.filter(t => t.done).length;
    statsText.textContent = tasks.length === 0
      ? '0 tâche'
      : `${doneCount} / ${tasks.length} terminée(s)`;
  }

  addBtn.addEventListener('click', addTask);
  taskInput.addEventListener('keydown', e => {
    if(e.key === 'Enter') addTask();
  });
  clearDoneBtn.addEventListener('click', clearDone);
  filterBtns.forEach(btn => btn.addEventListener('click', () => setFilter(btn.dataset.filter)));

  render();
</script>

</body>
</html>
